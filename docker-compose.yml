version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: paimana_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=
      - CSV_PATH=/app/paimana_timeseries_master.csv
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: paimana_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
